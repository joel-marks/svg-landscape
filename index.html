<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Final copy as of Phase 8; these were scaffold placeholders through 7.5
         (CONTEXT.md section 11). The description is deliberately literal about
         what the app is and what it costs — there is no signup, no backend and
         no upload, and those are the three things worth saying in 160
         characters. -->
    <title>SVG Landscape Generator — procedural landscape SVGs in your browser</title>
    <meta
      name="description"
      content="Generate procedural 2D landscape SVGs in your browser: ten landscape types, curated colour themes, time-of-day lighting. Free, no signup, nothing uploaded."
    />
    <link rel="canonical" href="https://joel-marks.github.io/svg-landscape/" />

    <!-- Two theme-colors rather than one: the browser chrome should match
         whichever surface the page is actually showing (--surface, per
         style.css). A single value is wrong in one of the two schemes. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#7e848b" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1317" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SVG Landscape Generator" />
    <meta property="og:title" content="SVG Landscape Generator" />
    <meta
      property="og:description"
      content="Generate procedural 2D landscape SVGs in your browser: ten landscape types, curated colour themes, time-of-day lighting. Free, no signup, nothing uploaded."
    />
    <meta property="og:url" content="https://joel-marks.github.io/svg-landscape/" />
    <!-- Absolute, and it has to be: the crawlers that read these do not resolve
         relative URLs against the page. Rendered by the offline harness from a
         real scene rather than mocked up — see CONTEXT.md section 17, Phase 8. -->
    <meta property="og:image" content="https://joel-marks.github.io/svg-landscape/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A generated dusk landscape: six ridgelines receding into haze under a rising moon and a field of stars, in cool blues with a warm band at the horizon."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SVG Landscape Generator" />
    <meta
      name="twitter:description"
      content="Generate procedural 2D landscape SVGs in your browser: ten landscape types, curated colour themes, time-of-day lighting. Free, no signup, nothing uploaded."
    />
    <meta name="twitter:image" content="https://joel-marks.github.io/svg-landscape/og-image.png" />

    <!-- Structured data (Phase 12). One block, two nodes in a @graph rather than
         a Person nested inside the WebApplication: the author is a stable entity
         with its own `@id`, so anything else on this site that wants to reference
         the same person references the node instead of repeating it.

         `description` is the meta description above, word for word — the same app
         has to be described the same way in every place a crawler reads it, and
         two nearly-identical descriptions are worse than one repeated.

         The name and site URL are the ones about.md's own Credits line carries,
         not a variant invented here; `sameAs` pairs it with the GitHub profile
         the header's repo link belongs to. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://joel-marks.github.io/svg-landscape/#app",
            "name": "SVG Landscape Generator",
            "url": "https://joel-marks.github.io/svg-landscape/",
            "description": "Generate procedural 2D landscape SVGs in your browser: ten landscape types, curated colour themes, time-of-day lighting. Free, no signup, nothing uploaded.",
            "applicationCategory": "DesignApplication",
            "operatingSystem": "Web",
            "browserRequirements": "Requires JavaScript.",
            "isAccessibleForFree": true,
            "license": "https://opensource.org/licenses/MIT",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "author": { "@id": "https://joelbmarks.com/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://joelbmarks.com/#person",
            "name": "Joel B. Marks",
            "url": "https://joelbmarks.com",
            "sameAs": ["https://joelbmarks.com", "https://github.com/joel-marks"]
          }
        ]
      }
    </script>

    <!-- Critical, inline, and deliberately not in style.css: everything here
         exists to cover the window *before* style.css has arrived, so a rule
         living in that file could not do the job (Phase 8, CONTEXT.md
         section 9).

         Two problems, one gate. (1) The header's GitHub mark is an inlined
         <svg> inside an <a>. With no stylesheet it has no intrinsic size, so
         the UA falls back to 300x150, and `fill="currentColor"` resolves
         against the UA's own link colour — a visited link is purple. That is
         the large purple flash this replaces; explicit width/height attributes
         on the SVG fix the size and the `color: inherit` below fixes the
         colour. (2) The page fades in once the app has initialised.

         Every selector is scoped under `html:not(.app-ready)`, which main.js
         clears at the end of init. That matters more than it looks: this block
         is *unlayered*, so it would otherwise outrank every rule in style.css's
         @layer base regardless of specificity — `a { color: inherit }` left
         live would beat `.markdown a` and the header link's own hover. Scoped
         this way it stops applying entirely the moment the app is up.

         **Failure-safe.** The fade is not an `opacity: 0` waiting on a class
         that a thrown exception would stop arriving. The same `:not(.app-ready)`
         state also carries a 2.5s animation that ends at full opacity, so a
         module that errors before init — or one that never runs at all — costs
         the fade, not the page. The <noscript> block covers scripting being off
         outright, where no animation is needed at all.

         Reduced motion (CONTEXT.md section 11) gates the whole thing: at
         `reduce` there is no starting opacity, so the content simply appears. -->
    <style>
      html:not(.app-ready) a {
        color: inherit;
      }

      @media (prefers-reduced-motion: no-preference) {
        html:not(.app-ready) body {
          opacity: 0;
          /* Reveals the page even if `.app-ready` never arrives. An animation
             beats the declaration above it once it starts, so this cannot be
             stuck behind the thing it is insuring against. */
          animation: app-load-failsafe 1ms linear 2.5s forwards;
        }

        body {
          transition: opacity 200ms ease-out;
        }

        @keyframes app-load-failsafe {
          to {
            opacity: 1;
          }
        }
      }
    </style>
    <noscript>
      <style>
        html:not(.app-ready) body {
          opacity: 1;
          animation: none;
        }
      </style>
    </noscript>
  </head>

  <body class="flex min-h-dvh flex-col">
    <!-- `bg-surface-header`, not `bg-surface-raised`: the two hold the same
         value, but the header deliberately sits on the untinted side of the
         scene tint (CONTEXT.md section 5, Phase 10). The page field behind it
         does too; the panel chrome below does not. -->
    <header class="border-b border-border-token bg-surface-header">
      <!-- `shell` is shared by header and main so every side margin resolves to
           the same computed value (CONTEXT.md section 5). It was header + main +
           footer through Phase 6.11; the footer is gone as of 6.12 and the
           convention is unaffected — it is one class defining one gutter, and
           dropping a consumer does not change what it computes to. -->
      <!-- The theme toggle that used to sit here moved into the panel's
           Preferences folder in Phase 6 (CONTEXT.md section 5) — it is not
           duplicated here. -->
      <div class="shell flex items-center gap-4 py-3">
        <!-- The page's single <h1>, and it was already one before Phase 12 — the
             heading level needed no promoting, only the guarantee that nothing
             else claims it. The About copy injected into <main> below is the one
             thing that could, and is rendered a level down for exactly that
             reason (vite.config.js, markdown.js).

             The subtitle is the only visible text Phase 12 adds anywhere on the
             page. `leading-tight` keeps the two lines close enough to read as one
             block, and the header grows by the line's height and nothing else. -->
        <div>
          <h1 class="text-base font-semibold tracking-tight">
            SVG Landscape Generator
          </h1>
          <p class="text-xs leading-tight text-muted">A procedural scene designer</p>
        </div>

        <!-- Top-right, and the page's only outbound link since the footer was
             removed in Phase 6.12. The build hash replaces package.json's
             version, which is a permanent 0.0.0 on a private package; main.js
             writes it from the `__COMMIT_HASH__` constant Vite substitutes at
             build time (vite.config.js). -->
        <div class="ml-auto flex items-center gap-3 text-muted">
          <span
            id="build-hash"
            class="font-mono text-xs"
            title="Build commit"
          ></span>

          <a
            class="block hover:text-text"
            href="https://github.com/joel-marks/svg-landscape"
            aria-label="Source on GitHub"
          >
            <!-- The GitHub mark, inlined rather than pulled from an icon
                 package: one static icon does not justify reinstating the
                 dependency Phase 6.5 removed (CONTEXT.md section 2). -->
            <!-- The width/height attributes are the pre-stylesheet size, and
                 match what `h-5 w-5` resolves to once CSS arrives (20px). An
                 <svg> with neither has no intrinsic size and the UA gives it
                 300x150 — see the critical style in <head>. -->
            <svg
              class="h-5 w-5"
              width="20"
              height="20"
              viewBox="0 0 16 16"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
              />
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main class="shell flex-1 py-6">
      <!-- Cosmetic only (CONTEXT.md section 5, Phase 13). One pixel of nothing,
           pulled back out of the flow by an equal negative bottom margin, sitting
           at exactly the y the figure below starts sticking at — so an
           IntersectionObserver on it says whether the scene is pinned without
           anything reading a scroll position. `src/ui/scenepin.js` toggles
           `is-stuck` on the figure from it, which draws the hairline and nothing
           else. With that script absent, failed, or on a browser without
           IntersectionObserver, the pin itself is unaffected: it is `position:
           sticky` and owes the observer nothing. -->
      <div id="scene-pin-sentinel" aria-hidden="true"></div>

      <!-- `scene-pin` rather than `m-0`: the figure is the canvas frame's
           wrapper, and below 1024px it is what pins to the top of the viewport
           while the panel scrolls beneath it (CONTEXT.md sections 5, 11). The
           class carries `margin: 0` itself, so nothing is lost by dropping the
           utility — and a utility-layer margin would have beaten the negative
           inline margin that takes the pinned band out to the viewport edges,
           since Tailwind's utilities layer outranks @layer base. -->
      <figure class="scene-pin">
        <div
          id="canvas-frame"
          class="aspect-video overflow-hidden rounded-lg bg-surface-sunken shadow-sm inset-ring-1 inset-ring-border-token"
        >
          <svg
            id="landscape"
            class="block h-full w-full"
            role="img"
            aria-label="Procedurally generated landscape"
          ></svg>
        </div>

        <figcaption class="sr-only">
          A generated landscape scene. Use the Scene controls below to change
          the landscape type or draw a new view.
        </figcaption>
      </figure>

      <!-- Controls sit below the canvas in three columns (CONTEXT.md section 5).
           A side panel is unworkable once the canvas can be an X-Pan or
           LinkedIn strip. Each column hosts one Tweakpane instance; the folder
           titles inside are the accordion headings, so there is no separate
           markup chrome to keep in sync with them.

           Phase 8 adds the step down. Desktop-first stays — three columns at
           `lg` and up — but the layout no longer falls straight from three to
           one at 1024px, which is what it did through 7.5 and what made the
           768px range the worst width to use the app at: a single 736px-wide
           column of controls under a 736px-wide canvas, scrolled forever.
           `sm` (640px) is where two columns stop fitting: the panes' own label
           and value columns need roughly 300px each before Tweakpane starts
           truncating labels, and two of those plus the gutter and the gap is
           just about 640. The three column wrappers reflow 2 + 1 at that size
           rather than being repacked — `items-start` means the odd one out sits
           at the top of the second row, and the alternative (splitting the
           wrappers so six panes flow freely) would let Presets and Preferences
           land next to each other, which is exactly the grouping the three
           columns exist to prevent. -->
      <div
        id="control-columns"
        class="tweakpane-scope mt-6 grid items-start gap-4 sm:grid-cols-2 lg:grid-cols-3"
      >
        <!-- The left column stacks two panes: Presets on top as its own panel,
             then Canvas/Scene. The inner gap matches the grid's own gutter so
             the stack reads on the same rhythm as the columns beside it. -->
        <div class="flex flex-col gap-4">
          <section id="panel-presets" aria-label="Presets"></section>
          <section id="panel-left" aria-label="Canvas and scene controls"></section>
        </div>
        <!-- The centre column stacks two panes on the same rhythm as the outer
             two, Lighting above Color (CONTEXT.md section 5). -->
        <div class="flex flex-col gap-4">
          <section id="panel-lighting" aria-label="Lighting controls"></section>
          <section id="panel-colour" aria-label="Color controls"></section>
        </div>

        <!-- The right column stacks two panes on the same rhythm as the left,
             Actions above Preferences (CONTEXT.md section 5). -->
        <div class="flex flex-col gap-4">
          <section id="panel-actions" aria-label="Actions"></section>
          <section id="panel-preferences" aria-label="Preferences"></section>
        </div>
      </div>

      <!-- The About copy, rendered into this container at build time from
           src/about/about.md by the hook in vite.config.js — the same file the
           About modal has always shown, through the same renderer, now rendered
           once instead of per-open (CONTEXT.md sections 10, 11).

           Why it is in the document at all: before this phase this prose reached
           the page only when the About button was pressed, so the one piece of
           real writing about what this app is did not exist in the HTML a crawler
           is served. It ships here instead, inside <main> so it sits in the
           landmark structure, and `hidden` because the About button is what
           reveals it — user-revealable content, not text positioned off-screen
           for a robot to find. `help.js` moves this exact node into the dialog on
           first open rather than rendering a second copy of it.

           The slot comment is what the hook replaces; with no hook this container
           is simply empty, which is the honest failure rather than a stale copy
           of the copy. -->
      <div id="about-content" class="markdown" hidden><!--about-content--></div>
    </main>

    <!-- No footer as of Phase 6.12 (CONTEXT.md sections 3 and 11). It carried
         one sentence: an MIT mention, already stated by LICENSE and the README,
         and the GitHub link, which moved into the header above. -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
