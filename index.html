<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PLACEHOLDER copy — final title/description/OG values land in the SEO pass (CONTEXT.md section 11). -->
    <title>Landscape SVG Generator</title>
    <meta
      name="description"
      content="PLACEHOLDER — Generate procedural 2D landscape SVGs in the browser and download them. No backend, no accounts."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Landscape SVG Generator" />
    <meta
      property="og:description"
      content="PLACEHOLDER — Generate procedural 2D landscape SVGs in the browser and download them."
    />
    <meta property="og:url" content="https://joel-marks.github.io/svg-landscape/" />
    <!-- PLACEHOLDER — og:image asset not yet created. -->
    <meta property="og:image" content="https://joel-marks.github.io/svg-landscape/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body class="flex min-h-dvh flex-col">
    <header class="border-b border-border-token bg-surface-raised">
      <!-- `shell` is shared by header, main and footer so every side margin
           resolves to the same computed value (CONTEXT.md section 5). -->
      <div class="shell flex items-center gap-4 py-3">
        <h1 class="text-base font-semibold tracking-tight">
          Landscape SVG Generator
        </h1>

        <button
          id="theme-toggle"
          type="button"
          class="ml-auto inline-flex items-center gap-2 rounded-md border border-border-token bg-surface px-2.5 py-1.5 text-sm text-muted transition-colors hover:text-text"
          aria-label="Theme: system"
        >
          <span data-theme-icon="system"><i data-lucide="monitor"></i></span>
          <span data-theme-icon="light" hidden><i data-lucide="sun"></i></span>
          <span data-theme-icon="dark" hidden><i data-lucide="moon"></i></span>
          <span id="theme-label" class="hidden sm:inline">System</span>
        </button>
      </div>
    </header>

    <main class="shell flex-1 py-6">
      <figure class="m-0">
        <div
          id="canvas-frame"
          class="aspect-video overflow-hidden rounded-lg border border-border-token bg-surface-sunken shadow-sm"
        >
          <svg
            id="landscape"
            class="block h-full w-full"
            role="img"
            aria-label="Procedurally generated landscape"
          ></svg>
        </div>

        <figcaption class="sr-only">
          A generated landscape scene. Use the Scene controls below to change
          the landscape type or draw a new view.
        </figcaption>
      </figure>

      <!-- Controls sit below the canvas in three columns (CONTEXT.md section 5).
           A side panel is unworkable once the canvas can be an X-Pan or
           LinkedIn strip. Each column hosts one Tweakpane instance; the folder
           titles inside are the accordion headings, so there is no separate
           markup chrome to keep in sync with them. -->
      <div id="control-columns" class="mt-6 grid items-start gap-4 lg:grid-cols-3">
        <section id="panel-left" aria-label="Canvas and scene controls"></section>
        <section id="panel-centre" aria-label="Lighting and colour controls"></section>
        <section id="panel-right" aria-label="Actions"></section>
      </div>
    </main>

    <footer class="border-t border-border-token bg-surface-raised">
      <div class="shell py-3 text-sm text-muted">
        <p>
          MIT licensed.
          <a
            class="underline underline-offset-2 hover:text-text"
            href="https://github.com/joel-marks/svg-landscape"
            >Source on GitHub</a
          >.
        </p>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
