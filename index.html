<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PLACEHOLDER copy — final title/description/OG values land in the SEO pass (CONTEXT.md section 11). -->
    <title>SVG Landscape Generator</title>
    <meta
      name="description"
      content="PLACEHOLDER — Generate procedural 2D landscape SVGs in the browser and download them. No backend, no accounts."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SVG Landscape Generator" />
    <meta
      property="og:description"
      content="PLACEHOLDER — Generate procedural 2D landscape SVGs in the browser and download them."
    />
    <meta property="og:url" content="https://joel-marks.github.io/svg-landscape/" />
    <!-- PLACEHOLDER — og:image asset not yet created. -->
    <meta property="og:image" content="https://joel-marks.github.io/svg-landscape/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body class="flex min-h-dvh flex-col">
    <header class="border-b border-border-token bg-surface-raised">
      <!-- `shell` is shared by header and main so every side margin resolves to
           the same computed value (CONTEXT.md section 5). It was header + main +
           footer through Phase 6.11; the footer is gone as of 6.12 and the
           convention is unaffected — it is one class defining one gutter, and
           dropping a consumer does not change what it computes to. -->
      <!-- The theme toggle that used to sit here moved into the panel's
           Preferences folder in Phase 6 (CONTEXT.md section 5) — it is not
           duplicated here. -->
      <div class="shell flex items-center gap-4 py-3">
        <h1 class="text-base font-semibold tracking-tight">
          SVG Landscape Generator
        </h1>

        <!-- Top-right, and the page's only outbound link since the footer was
             removed in Phase 6.12. The build hash replaces package.json's
             version, which is a permanent 0.0.0 on a private package; main.js
             writes it from the `__COMMIT_HASH__` constant Vite substitutes at
             build time (vite.config.js). -->
        <div class="ml-auto flex items-center gap-3 text-muted">
          <span
            id="build-hash"
            class="font-mono text-xs"
            title="Build commit"
          ></span>

          <a
            class="block hover:text-text"
            href="https://github.com/joel-marks/svg-landscape"
            aria-label="Source on GitHub"
          >
            <!-- The GitHub mark, inlined rather than pulled from an icon
                 package: one static icon does not justify reinstating the
                 dependency Phase 6.5 removed (CONTEXT.md section 2). -->
            <svg
              class="h-5 w-5"
              viewBox="0 0 16 16"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
              />
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main class="shell flex-1 py-6">
      <figure class="m-0">
        <div
          id="canvas-frame"
          class="aspect-video overflow-hidden rounded-lg bg-surface-sunken shadow-sm inset-ring-1 inset-ring-border-token"
        >
          <svg
            id="landscape"
            class="block h-full w-full"
            role="img"
            aria-label="Procedurally generated landscape"
          ></svg>
        </div>

        <figcaption class="sr-only">
          A generated landscape scene. Use the Scene controls below to change
          the landscape type or draw a new view.
        </figcaption>
      </figure>

      <!-- Controls sit below the canvas in three columns (CONTEXT.md section 5).
           A side panel is unworkable once the canvas can be an X-Pan or
           LinkedIn strip. Each column hosts one Tweakpane instance; the folder
           titles inside are the accordion headings, so there is no separate
           markup chrome to keep in sync with them. -->
      <div
        id="control-columns"
        class="tweakpane-scope mt-6 grid items-start gap-4 lg:grid-cols-3"
      >
        <!-- The left column stacks two panes: Presets on top as its own panel,
             then Canvas/Scene. The inner gap matches the grid's own gutter so
             the stack reads on the same rhythm as the columns beside it. -->
        <div class="flex flex-col gap-4">
          <section id="panel-presets" aria-label="Presets"></section>
          <section id="panel-left" aria-label="Canvas and scene controls"></section>
        </div>
        <section id="panel-centre" aria-label="Lighting and colour controls"></section>

        <!-- The right column stacks two panes on the same rhythm as the left,
             Actions above Preferences (CONTEXT.md section 5). -->
        <div class="flex flex-col gap-4">
          <section id="panel-actions" aria-label="Actions"></section>
          <section id="panel-preferences" aria-label="Preferences"></section>
        </div>
      </div>
    </main>

    <!-- No footer as of Phase 6.12 (CONTEXT.md sections 3 and 11). It carried
         one sentence: an MIT mention, already stated by LICENSE and the README,
         and the GitHub link, which moved into the header above. -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
